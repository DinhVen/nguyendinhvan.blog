<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Meta Blue to Electric Indigo/Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="45%" stop-color="#0866FF" />
      <stop offset="85%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <!-- Glass / Light glow for background -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Note Bubble Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F6FD" />
    </linearGradient>

    <!-- Accent Gradient for Music / V Symbol -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0866FF" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="bubbleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#001844" flood-opacity="0.42" />
    </filter>

    <filter id="sparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#FFD700" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#topGlow)" />
  <!-- Inner border highlight -->
  <rect x="17" y="17" width="478" height="478" rx="111" ry="111" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Note Thought Bubble (Facebook Messenger Note Style) -->
  <g filter="url(#bubbleShadow)">
    <!-- Main Bubble Pill -->
    <rect x="88" y="110" width="336" height="236" rx="84" ry="84" fill="url(#bubbleGrad)" />
    
    <!-- Bubble Tail Dots -->
    <circle cx="166" cy="378" r="24" fill="url(#bubbleGrad)" />
    <circle cx="132" cy="418" r="14" fill="url(#bubbleGrad)" />
  </g>

  <!-- Inside the Bubble: Stylized Music Note + VanIT "V" Monogram -->
  <g fill="url(#accentGrad)">
    <!-- Beam -->
    <path d="M214 176 L324 154 C330 152 336 156 336 162 L336 186 C336 191 331 195 326 196 L216 218 C211 219 206 215 206 210 L206 186 C206 180 210 176 214 176 Z" />
    
    <!-- Left Stem & Note Head -->
    <path d="M206 186 L206 270 C201 266 193 264 184 264 C166 264 152 276 152 292 C152 308 166 320 184 320 C202 320 216 308 216 292 L216 210 Z" />
    
    <!-- Right Stem & Note Head -->
    <path d="M326 164 L326 248 C321 244 313 242 304 242 C286 242 272 254 272 270 C272 286 286 298 304 298 C322 298 336 286 336 270 L336 188 Z" />
  </g>

  <!-- Sparkling Unlimited / Extended Star on Top Right of Bubble -->
  <g filter="url(#sparkleGlow)">
    <path d="M380 96 Q380 128 412 128 Q380 128 380 160 Q380 128 348 128 Q380 128 380 96 Z" fill="#FFDF00" />
    <circle cx="380" cy="128" r="4" fill="#FFFFFF" />
  </g>

  <!-- Tiny Secret / Security Lock Accent Badge (bottom right of bubble) -->
  <g transform="translate(332, 276)">
    <circle cx="20" cy="20" r="26" fill="#8B5CF6" />
    <circle cx="20" cy="20" r="26" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <!-- Lock Shackle -->
    <path d="M14 18 L14 14 C14 10.7 16.7 8 20 8 C23.3 8 26 10.7 26 14 L26 18" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" />
    <!-- Lock Body -->
    <rect x="11" y="17" width="18" height="14" rx="3.5" ry="3.5" fill="#FFFFFF" />
    <circle cx="20" cy="23" r="1.8" fill="#8B5CF6" />
    <path d="M20 24.5 L20 27.5" stroke="#8B5CF6" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>